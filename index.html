<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>WAV& Woman World — Links</title>
    <meta name="description" content="WAV& Woman World — Consultoria em gestão empresarial. Mentoria, evento e consultoria." />
    <style>
      :root{
        --verde:#344B40;
        --verde-deep:#26382F;
        --verde-ink:#1D2B24;
        --marfim:#F5F1E8;
        --ouro:#B39A70;
        --ouro-light:#D9C29A;
        --ouro-pale:#EFE3CB;
        --areia:#C9C3B6;
        --grafite:#252923;
        --petala:#E9B7C6;
        --petala-deep:#D98CA6;
      }
      *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
      html,body{margin:0;padding:0}
      body{
        font-family:"Times New Roman",Times,serif;
        color:var(--marfim);
        background:
          radial-gradient(120% 60% at 50% -10%, #42594d 0%, transparent 60%),
          radial-gradient(90% 50% at 85% 110%, #2c4237 0%, transparent 55%),
          linear-gradient(180deg, var(--verde) 0%, var(--verde-deep) 55%, var(--verde-ink) 100%);
        min-height:100vh;
        overflow-x:hidden;
      }

      /* ---------- pétalas ---------- */
      #petals{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
      .petal{position:absolute;top:-8vh;will-change:transform;animation:fall linear infinite}
      .petal i{
        display:block;width:100%;height:100%;
        border-radius:120% 4% 120% 4%;
        background:linear-gradient(135deg, #f6d3de 0%, var(--petala) 45%, var(--petala-deep) 100%);
        box-shadow:inset 0 0 6px rgba(255,255,255,.45);
        animation:sway ease-in-out infinite alternate;
      }
      .petal.gold i{background:linear-gradient(135deg, var(--ouro-pale) 0%, var(--ouro-light) 55%, var(--ouro) 100%)}
      .petal.blur i{filter:blur(2.5px)}
      @keyframes fall{
        0%{transform:translate3d(0,-8vh,0)}
        100%{transform:translate3d(var(--drift,30px),112vh,0)}
      }
      @keyframes sway{
        from{transform:rotate(-38deg) rotateY(12deg)}
        to{transform:rotate(52deg) rotateY(64deg)}
      }

      .page{
        position:relative;z-index:2;
        max-width:520px;margin:0 auto;
        padding:40px 20px 34px;
        display:flex;flex-direction:column;align-items:center;
      }

      /* ---------- logo ---------- */
      .logo-wrap{
        width:min(212px,58vw);
        animation:rise .9s cubic-bezier(.22,.8,.3,1) both;
        filter:drop-shadow(0 6px 22px rgba(0,0,0,.35));
      }
      .logo-wrap img{width:100%;height:auto;display:block}
      .tagline{
        margin:16px 0 0;text-align:center;
        font-size:12px;letter-spacing:.42em;text-transform:uppercase;
        color:var(--areia);font-weight:400;padding-left:.42em;
        animation:rise .9s .12s cubic-bezier(.22,.8,.3,1) both;
      }
      .rule{
        margin:22px auto 0;width:64px;height:1px;border:0;
        background:linear-gradient(90deg,transparent,var(--ouro),transparent);
        animation:rise .9s .2s cubic-bezier(.22,.8,.3,1) both;
      }

      /* ---------- palco da modelo + faixas ---------- */
      .stage{
        position:relative;width:100%;margin-top:40px;
        display:flex;justify-content:center;
        animation:rise 1s .25s cubic-bezier(.22,.8,.3,1) both;
      }
      .watermark{
        position:absolute;top:-38px;left:50%;transform:translateX(-50%);
        font-family:"Times New Roman",Times,serif;font-weight:600;
        font-size:clamp(90px,26vw,150px);line-height:1;letter-spacing:.02em;
        color:rgba(245,241,232,.07);white-space:nowrap;z-index:0;user-select:none;
      }
      /* faixa de trás — desfocada */
      .band{
        position:absolute;left:50%;width:130%;
        overflow:hidden;white-space:nowrap;pointer-events:none;
      }
      .band-back{
        top:64%;z-index:1;
        transform:translateX(-50%) rotate(-5deg);
        background:rgba(245,241,232,.14);
        border-top:1px solid rgba(217,194,154,.35);
        border-bottom:1px solid rgba(217,194,154,.35);
        backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
        filter:blur(1.6px);opacity:.75;
        padding:10px 0;
      }
      .band-back .track{animation:scrollL 46s linear infinite}
      .band-back span{
        font-size:13px;letter-spacing:.38em;font-weight:500;
        color:rgba(245,241,232,.85);text-transform:uppercase;
      }
      /* foto — moldura linha dupla dourada com losangos e luz envolta */
      .model{
        position:relative;z-index:2;
        width:min(190px,54vw);
      }
      .model::before{
        /* halo de luz dourada ao redor da moldura */
        content:"";position:absolute;inset:-7% -9%;z-index:0;pointer-events:none;
        background:radial-gradient(50% 50% at 50% 50%, rgba(217,194,154,.34) 0%, rgba(217,194,154,.13) 52%, rgba(217,194,154,0) 76%);
        filter:blur(16px);
        animation:glowPulse 4.8s ease-in-out infinite;
      }
      @keyframes glowPulse{
        0%,100%{opacity:.75;transform:scale(1)}
        50%{opacity:1;transform:scale(1.045)}
      }
      .model-frame{
        /* linha externa da moldura dupla */
        position:relative;z-index:1;
        border-radius:999px;
        padding:6px;
        border:1.5px solid rgba(217,194,154,.95);
        box-shadow:
          0 0 26px rgba(217,194,154,.42),
          0 24px 48px rgba(0,0,0,.4);
      }
      .model-inner{
        /* linha interna, separada da externa pelo vão */
        border-radius:999px;
        padding:5px;
        border:1.5px solid rgba(217,194,154,.8);
      }
      /* carrossel dentro da moldura — a moldura fica fixa, só a foto troca */
      .slides{
        position:relative;border-radius:999px;overflow:hidden;
        aspect-ratio:2/3;
        cursor:pointer;touch-action:pan-y;
        background:#43413c;
      }
      .slide{
        position:absolute;inset:0;width:100%;height:100%;
        object-fit:cover;object-position:50% 12%;opacity:0;pointer-events:none;
        transition:opacity .6s ease;
      }
      .slide.is-active{opacity:1}
      /* setas pequenas ao lado da moldura */
      .car-btn{
        position:absolute;top:50%;z-index:4;
        width:32px;height:32px;padding:0;border-radius:50%;
        display:flex;align-items:center;justify-content:center;
        transform:translateY(-50%);
        background:rgba(29,43,36,.55);
        border:1px solid rgba(217,194,154,.8);
        color:var(--ouro-light);cursor:pointer;
        backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
        box-shadow:0 6px 16px rgba(0,0,0,.35);
        transition:background .2s ease,transform .2s ease;
      }
      .car-btn.prev{left:-62px}
      .car-btn.next{right:-62px}
      .car-btn:hover{background:rgba(29,43,36,.8)}
      .car-btn:active{transform:translateY(-50%) scale(.92)}
      .model .diamond{
        position:absolute;top:50%;z-index:2;width:13px;height:13px;
        transform:translateY(-50%) rotate(45deg);
        background:var(--verde-deep);
        border:1.5px solid var(--ouro-light);
        box-shadow:0 0 10px rgba(217,194,154,.75), inset 0 0 3px rgba(217,194,154,.5);
      }
      .model .diamond.l{left:-6px}
      .model .diamond.r{right:-6px}
      /* faixa da frente — nítida */
      .band-front{
        bottom:9%;z-index:3;
        transform:translateX(-50%) rotate(-2.4deg);
        background:linear-gradient(90deg,#a68d5f, var(--ouro) 30%, var(--ouro-light) 55%, var(--ouro) 80%, #a68d5f);
        box-shadow:0 14px 34px rgba(0,0,0,.4);
        padding:11px 0;
      }
      .band-front .track{animation:scrollR 30s linear infinite}
      .band-front span{
        font-size:13.5px;letter-spacing:.34em;font-weight:600;
        color:var(--verde-ink);text-transform:uppercase;
      }
      .band .track{display:inline-flex;will-change:transform}
      .band .chunk{display:inline-flex;align-items:center}
      .band .dot{margin:0 22px;font-size:9px;color:inherit;opacity:.7}
      .band-front .dot{color:var(--verde-ink)}
      @keyframes scrollL{from{transform:translateX(0)}to{transform:translateX(-50%)}}
      @keyframes scrollR{from{transform:translateX(-50%)}to{transform:translateX(0)}}

      /* ---------- botões ---------- */
      .links{
        width:min(400px,92%);margin-top:46px;
        display:flex;flex-direction:column;gap:18px;
      }
      @property --beam{syntax:"<angle>";initial-value:0deg;inherits:false}
      .btn{
        position:relative;display:block;text-decoration:none;
        border-radius:16px;padding:2px;isolation:isolate;
        background:rgba(245,241,232,.06);
        animation:rise .8s cubic-bezier(.22,.8,.3,1) both;
        transition:transform .25s cubic-bezier(.22,.8,.3,1);
      }
      .btn:nth-child(1){animation-delay:.4s}
      .btn:nth-child(2){animation-delay:.5s}
      .btn:nth-child(3){animation-delay:.6s}
      .btn:nth-child(4){animation-delay:.7s}
      /* feixe de luz viajando pela borda */
      .btn::before{
        content:"";position:absolute;inset:0;border-radius:16px;z-index:-1;
        background:conic-gradient(from var(--beam),
          rgba(179,154,112,.28) 0deg,
          rgba(179,154,112,.28) 268deg,
          var(--ouro-light) 306deg,
          #fff6dd 322deg,
          var(--ouro-light) 338deg,
          rgba(179,154,112,.28) 360deg);
        animation:beam 4.6s linear infinite;
      }
      .btn:nth-child(2)::before{animation-delay:-1.15s}
      .btn:nth-child(3)::before{animation-delay:-2.3s}
      .btn:nth-child(4)::before{animation-delay:-3.45s}
      @keyframes beam{to{--beam:360deg}}
      .btn-inner{
        position:relative;z-index:2;
        display:flex;align-items:center;gap:12px;
        background:linear-gradient(160deg, #3E5A4D, #2E463B 60%, #2A4237);
        border-radius:14px;padding:13px 16px;
      }
      .btn .ico{
        flex:0 0 auto;width:33px;height:33px;border-radius:50%;
        display:flex;align-items:center;justify-content:center;
        border:1px solid rgba(217,194,154,.55);color:var(--ouro-light);
        background:rgba(29,43,36,.35);
      }
      .btn .txt{flex:1;min-width:0}
      .btn .lbl{
        display:block;font-size:14.5px;font-weight:600;
        letter-spacing:.22em;color:var(--marfim);text-transform:uppercase;
      }
      .btn .sub{
        display:block;margin-top:3px;font-size:12.5px;font-weight:300;
        letter-spacing:.06em;color:var(--areia);
      }
      .btn .arrow{
        flex:0 0 auto;color:var(--ouro-light);
        transition:transform .25s cubic-bezier(.22,.8,.3,1);
      }
      .btn:hover{transform:translateY(-2px)}
      .btn:hover .arrow,.btn:active .arrow{transform:translateX(5px)}
      .btn:active{transform:scale(.985)}

      footer{
        margin-top:44px;text-align:center;
        animation:rise .9s .85s cubic-bezier(.22,.8,.3,1) both;
      }
      footer .f-logo{
        font-family:"Times New Roman",Times,serif;font-size:19px;font-weight:600;
        letter-spacing:.14em;color:var(--ouro-light);
      }
      footer p{
        margin:6px 0 0;font-size:11px;letter-spacing:.3em;
        text-transform:uppercase;color:rgba(201,195,182,.75);padding-left:.3em;
      }

      @keyframes rise{
        from{opacity:0;transform:translateY(18px)}
        to{opacity:1;transform:translateY(0)}
      }
      .stage{animation-name:riseStage}
      @keyframes riseStage{
        from{opacity:0;transform:translateY(18px)}
        to{opacity:1;transform:translateY(0)}
      }

      @media (min-width:760px){
        .page{padding-top:56px}
        .model{width:204px}
      }
      @media (prefers-reduced-motion: reduce){
        .band .track,.btn::before,.btn::after,.petal,.petal i,.model::before{animation:none !important}
        .logo-wrap,.tagline,.rule,.stage,.btn,footer{animation:none !important}
        .slide{transition:none}
      }
    </style>
  </head>

    <script>
      // Carrossel da moldura: setas, toque na foto e deslize trocam a foto (loop)
      (function () {
        var box = document.getElementById("slides");
        if (!box) return;
        var slides = box.querySelectorAll(".slide");
        var idx = 0;
        function show(n) {
          idx = ((n % slides.length) + slides.length) % slides.length;
          slides.forEach(function (s, i) { s.classList.toggle("is-active", i === idx); });
        }
        document.getElementById("carPrev").addEventListener("click", function () { show(idx - 1); });
        document.getElementById("carNext").addEventListener("click", function () { show(idx + 1); });
        // toque/clique na foto do centro avança
        var lastSwipe = 0;
        box.addEventListener("click", function () {
          if (Date.now() - lastSwipe < 400) return; // clique logo após o deslize não conta de novo
          show(idx + 1);
        });
        // deslize (swipe) sobre a foto
        var startX = null;
        box.addEventListener("touchstart", function (e) {
          startX = e.changedTouches[0].clientX;
        }, { passive: true });
        box.addEventListener("touchend", function (e) {
          if (startX === null) return;
          var dx = e.changedTouches[0].clientX - startX;
          startX = null;
          if (Math.abs(dx) > 42) {
            lastSwipe = Date.now();
            show(idx + (dx < 0 ? 1 : -1));
          }
        }, { passive: true });
      })();

      // Faixas rolando: monta a frase repetida (2 cópias p/ loop contínuo)
      (function () {
        var phrase = "Consultoria em Gestão Empresarial";
        var chunk = '<span class="chunk"><span>' + phrase + '</span><span class="dot">◆</span></span>';
        var half = chunk.repeat(4);
        document.querySelectorAll("[data-track]").forEach(function (t) {
          t.innerHTML = half + half;
        });
      })();

      // Pétalas caindo/flutuando
      (function () {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var box = document.getElementById("petals");
        var N = 18;
        for (var i = 0; i < N; i++) {
          var p = document.createElement("div");
          p.className = "petal";
          var size = 9 + Math.random() * 20;
          var dur = 11 + Math.random() * 14;
          p.style.left = (Math.random() * 100) + "vw";
          p.style.width = size + "px";
          p.style.height = size * 0.82 + "px";
          p.style.setProperty("--drift", (Math.random() * 140 - 70) + "px");
          p.style.animationDuration = dur + "s";
          p.style.animationDelay = (-Math.random() * dur) + "s";
          p.style.opacity = (0.35 + Math.random() * 0.5).toFixed(2);
          if (Math.random() < 0.22) p.classList.add("gold");
          if (Math.random() < 0.3) p.classList.add("blur");
          var inner = document.createElement("i");
          inner.style.animationDuration = (1.8 + Math.random() * 2.4) + "s";
          p.appendChild(inner);
          box.appendChild(p);
        }
      })();
    </script>
  </body>
</html>
