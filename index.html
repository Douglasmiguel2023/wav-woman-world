<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />

    <title>WAV& Woman World — Links</title>
    <meta name="description" content="WAV& Woman World — Consultoria em gestão empresarial. Mentoria, evento e consultoria." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root{
        --verde:#344B40;
        --verde-deep:#26382F;
        --verde-ink:#1D2B24;
        --marfim:#F5F1E8;
        --ouro:#B39A70;
        --ouro-light:#D9C29A;
        --ouro-pale:#EFE3CB;
        --areia:#C9C3B6;
        --grafite:#252923;
        --petala:#E9B7C6;
        --petala-deep:#D98CA6;
      }
      *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
      html,body{margin:0;padding:0}
      body{
        font-family:"Jost",system-ui,sans-serif;
        color:var(--marfim);
        background:
          radial-gradient(120% 60% at 50% -10%, #42594d 0%, transparent 60%),
          radial-gradient(90% 50% at 85% 110%, #2c4237 0%, transparent 55%),
          linear-gradient(180deg, var(--verde) 0%, var(--verde-deep) 55%, var(--verde-ink) 100%);
        min-height:100vh;
        overflow-x:hidden;
      }

      /* ---------- pétalas ---------- */
      #petals{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
      .petal{position:absolute;top:-8vh;will-change:transform;animation:fall linear infinite}
      .petal i{
        display:block;width:100%;height:100%;
        border-radius:120% 4% 120% 4%;
        background:linear-gradient(135deg, #f6d3de 0%, var(--petala) 45%, var(--petala-deep) 100%);
        box-shadow:inset 0 0 6px rgba(255,255,255,.45);
        animation:sway ease-in-out infinite alternate;
      }
      .petal.gold i{background:linear-gradient(135deg, var(--ouro-pale) 0%, var(--ouro-light) 55%, var(--ouro) 100%)}
      .petal.blur i{filter:blur(2.5px)}
      @keyframes fall{
        0%{transform:translate3d(0,-8vh,0)}
        100%{transform:translate3d(var(--drift,30px),112vh,0)}
      }
      @keyframes sway{
        from{transform:rotate(-38deg) rotateY(12deg)}
        to{transform:rotate(52deg) rotateY(64deg)}
      }

      .page{
        position:relative;z-index:2;
        max-width:520px;margin:0 auto;
        padding:34px 20px 30px;
        display:flex;flex-direction:column;align-items:center;
      }

      /* ---------- logo ---------- */
      .logo-wrap{
        width:min(300px,76vw);
        animation:rise .9s cubic-bezier(.22,.8,.3,1) both;
        filter:drop-shadow(0 6px 22px rgba(0,0,0,.35));
      }
      .logo-wrap img{width:100%;height:auto;display:block}
      .tagline{
        margin:16px 0 0;text-align:center;
        font-size:12px;letter-spacing:.42em;text-transform:uppercase;
        color:var(--areia);font-weight:400;padding-left:.42em;
        animation:rise .9s .12s cubic-bezier(.22,.8,.3,1) both;
      }
      .rule{
        margin:18px auto 0;width:64px;height:1px;border:0;
        background:linear-gradient(90deg,transparent,var(--ouro),transparent);
        animation:rise .9s .2s cubic-bezier(.22,.8,.3,1) both;
      }

      /* ---------- palco da modelo + faixas ---------- */
      .stage{
        position:relative;width:100%;margin-top:30px;
        display:flex;justify-content:center;
        animation:rise 1s .25s cubic-bezier(.22,.8,.3,1) both;
      }
      .watermark{
        position:absolute;top:-38px;left:50%;transform:translateX(-50%);
        font-family:"Cormorant Garamond",serif;font-weight:600;
        font-size:clamp(90px,26vw,150px);line-height:1;letter-spacing:.02em;
        color:rgba(245,241,232,.07);white-space:nowrap;z-index:0;user-select:none;
      }
      /* faixa de trás — desfocada */
      .band{
        position:absolute;left:50%;width:130%;
        overflow:hidden;white-space:nowrap;pointer-events:none;
      }
      .band-back{
        top:16%;z-index:1;
        transform:translateX(-50%) rotate(-5deg);
        background:rgba(245,241,232,.14);
        border-top:1px solid rgba(217,194,154,.35);
        border-bottom:1px solid rgba(217,194,154,.35);
        backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
        filter:blur(1.6px);opacity:.75;
        padding:10px 0;
      }
      .band-back .track{animation:scrollL 46s linear infinite}
      .band-back span{
        font-size:13px;letter-spacing:.38em;font-weight:500;
        color:rgba(245,241,232,.85);text-transform:uppercase;
      }
      /* foto */
      .model{
        position:relative;z-index:2;
        width:min(320px,82vw);
        border-radius:170px 170px 18px 18px;
        padding:6px;
        background:linear-gradient(170deg, var(--ouro-light), var(--ouro) 55%, #8a744e);
        box-shadow:0 30px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(217,194,154,.25);
      }
      .model img{
        display:block;width:100%;height:auto;
        border-radius:164px 164px 13px 13px;
      }
      /* faixa da frente — nítida */
      .band-front{
        bottom:9%;z-index:3;
        transform:translateX(-50%) rotate(-2.4deg);
        background:linear-gradient(90deg,#a68d5f, var(--ouro) 30%, var(--ouro-light) 55%, var(--ouro) 80%, #a68d5f);
        box-shadow:0 14px 34px rgba(0,0,0,.4);
        padding:11px 0;
      }
      .band-front .track{animation:scrollR 30s linear infinite}
      .band-front span{
        font-size:13.5px;letter-spacing:.34em;font-weight:600;
        color:var(--verde-ink);text-transform:uppercase;
      }
      .band .track{display:inline-flex;will-change:transform}
      .band .chunk{display:inline-flex;align-items:center}
      .band .dot{margin:0 22px;font-size:9px;color:inherit;opacity:.7}
      .band-front .dot{color:var(--verde-ink)}
      @keyframes scrollL{from{transform:translateX(0)}to{transform:translateX(-50%)}}
      @keyframes scrollR{from{transform:translateX(-50%)}to{transform:translateX(0)}}

      /* ---------- botões ---------- */
      .links{
        width:100%;margin-top:38px;
        display:flex;flex-direction:column;gap:16px;
      }
      @property --beam{syntax:"<angle>";initial-value:0deg;inherits:false}
      .btn{
        position:relative;display:block;text-decoration:none;
        border-radius:16px;padding:2px;isolation:isolate;
        background:rgba(245,241,232,.06);
        animation:rise .8s cubic-bezier(.22,.8,.3,1) both;
        transition:transform .25s cubic-bezier(.22,.8,.3,1);
      }
      .btn:nth-child(1){animation-delay:.4s}
      .btn:nth-child(2){animation-delay:.5s}
      .btn:nth-child(3){animation-delay:.6s}
      .btn:nth-child(4){animation-delay:.7s}
      /* feixe de luz viajando pela borda */
      .btn::before{
        content:"";position:absolute;inset:0;border-radius:16px;z-index:-1;
        background:conic-gradient(from var(--beam),
          rgba(179,154,112,.28) 0deg,
          rgba(179,154,112,.28) 268deg,
          var(--ouro-light) 306deg,
          #fff6dd 322deg,
          var(--ouro-light) 338deg,
          rgba(179,154,112,.28) 360deg);
        animation:beam 4.6s linear infinite;
      }
      .btn:nth-child(2)::before{animation-delay:-1.15s}
      .btn:nth-child(3)::before{animation-delay:-2.3s}
      .btn:nth-child(4)::before{animation-delay:-3.45s}
      @keyframes beam{to{--beam:360deg}}
      .btn-inner{
        position:relative;z-index:2;
        display:flex;align-items:center;gap:14px;
        background:linear-gradient(160deg, #3E5A4D, #2E463B 60%, #2A4237);
        border-radius:14px;padding:19px 18px;
      }
      .btn .ico{
        flex:0 0 auto;width:40px;height:40px;border-radius:50%;
        display:flex;align-items:center;justify-content:center;
        border:1px solid rgba(217,194,154,.55);color:var(--ouro-light);
        background:rgba(29,43,36,.35);
      }
      .btn .txt{flex:1;min-width:0}
      .btn .lbl{
        display:block;font-size:16.5px;font-weight:600;
        letter-spacing:.24em;color:var(--marfim);text-transform:uppercase;
      }
      .btn .sub{
        display:block;margin-top:3px;font-size:12.5px;font-weight:300;
        letter-spacing:.06em;color:var(--areia);
      }
      .btn .arrow{
        flex:0 0 auto;color:var(--ouro-light);
        transition:transform .25s cubic-bezier(.22,.8,.3,1);
      }
      .btn:hover{transform:translateY(-2px)}
      .btn:hover .arrow,.btn:active .arrow{transform:translateX(5px)}
      .btn:active{transform:scale(.985)}

      footer{
        margin-top:36px;text-align:center;
        animation:rise .9s .85s cubic-bezier(.22,.8,.3,1) both;
      }
      footer .f-logo{
        font-family:"Cormorant Garamond",serif;font-size:19px;font-weight:600;
        letter-spacing:.14em;color:var(--ouro-light);
      }
      footer p{
        margin:6px 0 0;font-size:11px;letter-spacing:.3em;
        text-transform:uppercase;color:rgba(201,195,182,.75);padding-left:.3em;
      }

      @keyframes rise{
        from{opacity:0;transform:translateY(18px)}
        to{opacity:1;transform:translateY(0)}
      }
      .stage{animation-name:riseStage}
      @keyframes riseStage{
        from{opacity:0;transform:translateY(18px)}
        to{opacity:1;transform:translateY(0)}
      }

      @media (min-width:760px){
        .page{padding-top:48px}
        .model{width:340px}
      }
      @media (prefers-reduced-motion: reduce){
        .band .track,.btn::before,.btn::after,.petal,.petal i{animation:none !important}
        .logo-wrap,.tagline,.rule,.stage,.btn,footer{animation:none !important}
      }
    </style>
  </head>
